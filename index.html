<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小汉字 · 每日认字</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="./">🌱 小小汉字</a><button id="manage">管理字表与备份</button></header><main>
<div class="heading"><div><h1>每日认字</h1><p>按字表顺序读一读，再记录今天的表现。</p></div><button class="primary" id="start">开始逐字检查 →</button></div>
<div class="tools"><label>检查日期 <input type="date" id="date"></label><div class="filters"><button class="selected" data-filter="all">全部</button><button data-filter="pending">未检查</button><button data-filter="review">需复习</button><button data-filter="known">认识</button></div><span id="summary"></span></div><div class="progress"><i id="progress"></i></div>
<div id="groups"></div><p id="empty" hidden>这个筛选下没有汉字。</p><p class="footnote">点汉字可逐字检查 · 图片与拼音默认收起 · 检查结果保存在当前浏览器</p>
</main>
<dialog id="quiz"><button class="close" data-close="quiz" aria-label="关闭">×</button><div id="position"></div><div class="quiz-char" id="quiz-char"></div><div class="aids"><button id="speak">🔊 听读音</button><button id="reveal">查看提示</button></div><div id="hint" hidden></div><div class="answers"><button id="no" class="review">还不认识</button><button id="yes" class="primary">认识 ✓</button></div><div class="navigation"><button id="prev">← 上一个</button><button id="skip">暂时跳过 →</button></div><p id="quiz-status"></p></dialog>
<dialog id="manager"><button class="close" data-close="manager" aria-label="关闭">×</button><h2>管理字表</h2><p>每行一组，按从左到右、从上到下的顺序检查。可以直接修改或在末尾添加。</p><textarea id="list" rows="11" aria-label="有序汉字分组"></textarea><p class="note">照片中个别手写字可能辨认有误，请在这里核对。“着”按照片保留了两次。中间涂画的补充行未计入编号分组。</p><button id="save-list" class="primary">保存字表</button><hr><h3>学习记录备份</h3><p>导出包含字表及每天的检查结果，换设备时可导入。</p><button id="export">导出备份</button> <label class="file-button">导入备份<input id="import" type="file" accept="application/json" hidden></label><div id="legacy"></div><p id="storage" class="note"></p></dialog>
<div id="toast" role="status"></div><script src="hints.js"></script><script src="app.js"></script></body></html>
